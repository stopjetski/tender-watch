name: afdb access check

# Run by hand only. Asks afdb.org for robots.txt once, with the bot's real
# name, and prints whether the site lets it in and what its rules say.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m tender_watch check-afdb
