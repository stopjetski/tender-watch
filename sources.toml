# Which banks the daily run collects, and how far back it looks each day.
# To add a bank: see "How to add another bank" in README.md.

[worldbank]
enabled = true
# Re-read the last N days on every run, so late notices and corrections are caught.
lookback_days = 7

[afdb]
# Switched off: afdb.org answers this bot with a "prove you are a browser"
# challenge, from GitHub's machines as well (checked 19 Nov 2026). Turning
# this on would only make the daily run fail. See RECON.md.
enabled = false
lookback_days = 7
